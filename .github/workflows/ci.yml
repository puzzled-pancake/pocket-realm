# CI: repo hygiene + JVM unit tests.
#
# Scoping is deliberate (windows runners lack the MSYS2/NDK native toolchain,
# so no full APK builds here):
#   - hygiene (ubuntu): check_repo + pytest
#   - android-unit (windows): JVM unit tests only, with the mandatory
#     -PpocketAbi/-PpocketLane properties (build.gradle.kts refuses without them).
#   - desktop-unit (windows): the Windows sibling's JVM tests + detekt — the
#     shared-source manifest compiles the same android-tree files here, so CI
#     catches an android.* import creeping into a shared file even when only
#     the Android lane was being edited.
#   - desktop-native (windows, dispatch + weekly): builds the vcpkg deps +
#     both realm DLLs + the sqlite seam with MSVC, then runs the desktop
#     suite with -PrequireNatives so every DLL-guarded test executes
#     instead of skipping — desktop-unit alone never compiles C/C++.
# tools/check_sources.py stays local (pre-commit hook) because its
# prebuilt-archive checks require the local native/.providers cache.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repo hygiene gate
        run: python tools/check_repo.py
      - name: Install pytest
        run: python -m pip install pytest
      - name: Python tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        # The 8 deselected ids are the documented pre-existing substring-contract
        # failures; any NEW failure fails CI.
        run: |
          python -m pytest tests/ -q \
            --deselect tests/test_gladio_client_unpack_transport.py::GladioClientValidationLaneContractTest::test_arm_production_packaging_excludes_gladio \
            --deselect tests/test_gladio_client_unpack_transport.py::GladioClientValidationLaneContractTest::test_build_script_is_x86_validation_only \
            --deselect tests/test_vortek_lifecycle_hardening.py::test_java_control_plane_rejects_ambiguous_ownership_and_unknown_requests \
            --deselect tests/test_vortek_lifecycle_hardening.py::test_production_dispatch_opens_only_in_reviewed_bridge_target \
            --deselect tests/test_vortek_lifecycle_hardening.py::test_window_authority_is_generation_instance_and_lifetime_bound \
            --deselect tests/test_vortek_lifecycle_hardening.py::test_window_operations_revalidate_and_swapchain_creation_is_transactional \
            --deselect tests/test_vortek_winlator_baseline.py::test_source_built_guest_is_pinned_and_reports_receiver_map_errno \
            --deselect tests/test_vortek_winlator_baseline.py::test_idle_ring_wait_uses_peer_loss_and_progressive_backoff

  android-unit:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests + detekt
        run: ./gradlew :app:testDebugUnitTest :app:detekt -PpocketAbi=x86_64 -PpocketLane=full --console=plain

  desktop-unit:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # The co-load gate (NativeCoLoadTest) skips cleanly: CI has no MSVC lane
      # in this job; the desktop-native lane below builds them.
      - name: Desktop JVM tests + detekt
        run: ./gradlew.bat test detekt --console=plain

  # The native desktop lane: MSVC builds + the DLL-guarded tests. Manual
  # dispatch + weekly (the vcpkg bootstrap is far too slow for every push).
  # The Android NDK lanes and lockfiles are untouched by this job.
  desktop-native:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Stage native deps (vcpkg + OpenSSL legacy + boost + sqlite amalgamation)
        run: python scripts/build_win_deps.py
      - name: Build realm DLLs + extractors (MSVC)
        run: python tools/build_win_realm_runtime.py --extractors
      - name: Build the sqlite seam DLL
        run: python tools/build_win_sqlite_seam.py
      - uses: gradle/actions/setup-gradle@v4
      - name: Desktop suite with natives REQUIRED
        working-directory: desktop
        run: ./gradlew.bat test detekt -PrequireNatives --console=plain
