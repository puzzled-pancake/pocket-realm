# Pocket Realm Android build properties.
# The shared-source module compiles ~all files after a package move; the
# Kotlin daemon's default heap OOMs (GC overhead limit) on that one-time
# hump. Sized for the 64 GB host (the desktop lane keeps its own twin).
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Djava.io.tmpdir=E:/pocket_realm_toolchain/tmp
kotlin.daemon.jvmargs=-Xmx6g
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
