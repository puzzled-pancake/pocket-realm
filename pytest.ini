[pytest]
# COMPLETION-PLAN section 7 (R3-4, revised round-6 R6-r6-3/R3-r6-2): test
# scratch lives on E: — but pytest's OWN per-session uniqueness supplies the
# directory name (PYTEST_DEBUG_TEMPROOT via conftest.py, NOT a fixed shared
# base directory: concurrent pytest sessions prune each other's fixture
# dirs under a fixed root).
# W0 close-out: collection is scoped to the tracked suite. Every tracked
# test module lives under tests/ (62 files, git ls-files verified); the
# repo's scratch dirs (tmp/, out/, build/, .tmp/) hold round-scratch
# scripts that are NOT suite members — a stray test_*.py there must never
# be collected (a module-level sys.exit in tmp/r8r3 crashed the whole
# session with 362 collection errors).
testpaths = tests
